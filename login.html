<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG-IN</title>
     
</head>
<body class="auth-body">
    <!-- CONTAINER -->
<main class="login-container">
<h1>Welcome Back!</h1>
<p>Continue your journey with SkillsWrap.</p>
<form id="login-form">
    <label class="fullname">Usermame</label>
    <input type="text" id="username" name="username" class="signup-input" placeholder="Enter you username" required>

<label class="password">Password</label>
<input type="password" id="password" name="password" class="signup-input" placeholder="Enter your password" required minlength="8" maxlength="10">

    <button type="submit" class="primary-but">Login</button>
</form>

<p class="login-link">Dont have an account?
    <a href="signup.html" class="links">Sign up</a>
</p>
</main>
<script src="/script.js"></script>
</body>
</html>
