<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="Two learners swapping skills along a roadmap of progress">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2250"/>
      <stop offset="1" stop-color="#7A4E8F"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>

  <!-- decorative shapes -->
  <circle cx="540" cy="100" r="150" fill="#F2A33A"/>
  <circle cx="60" cy="250" r="78" fill="none" stroke="#46B8AF" stroke-width="4"/>
  <circle cx="560" cy="540" r="10" fill="#F7EFE0" opacity=".5"/>
  <circle cx="90" cy="520" r="6" fill="#F7EFE0" opacity=".5"/>
  <circle cx="330" cy="190" r="5" fill="#F7EFE0" opacity=".6"/>

  <!-- skill cards -->
  <g>
    <rect x="70" y="236" width="130" height="48" rx="24" fill="#FFFDF8"/>
    <circle cx="96" cy="260" r="10" fill="#46B8AF"/>
    <rect x="116" y="252" width="62" height="7" rx="3.5" fill="#2A2250"/>
    <rect x="116" y="264" width="40" height="6" rx="3" fill="#B8ABBD"/>
  </g>
  <g>
    <rect x="440" y="276" width="130" height="48" rx="24" fill="#FFFDF8"/>
    <circle cx="466" cy="300" r="10" fill="#F2A33A"/>
    <rect x="486" y="292" width="62" height="7" rx="3.5" fill="#2A2250"/>
    <rect x="486" y="304" width="40" height="6" rx="3" fill="#B8ABBD"/>
  </g>

  <!-- person A -->
  <circle cx="215" cy="360" r="46" fill="#F7EFE0"/>
  <path d="M215 330 a46 46 0 0 1 46 40 q-20 -30 -92 -12 a46 46 0 0 1 46 -28z" fill="#2A2250" opacity=".85"/>
  <rect x="152" y="418" width="126" height="170" rx="63" fill="#46B8AF"/>

  <!-- person B -->
  <circle cx="425" cy="360" r="46" fill="#F7EFE0"/>
  <path d="M379 366 a46 46 0 0 1 92 0 q-46 -34 -92 0z" fill="#F2A33A"/>
  <rect x="362" y="418" width="126" height="170" rx="63" fill="#C79BDB"/>

  <!-- swap badge -->
  <circle cx="320" cy="480" r="38" fill="#FFFDF8"/>
  <g fill="none" stroke="#2A2250" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M298 470 H340 M330 460 L340 470 L330 480"/>
    <path d="M342 492 H300 M310 482 L300 492 L310 502"/>
  </g>

  <!-- roadmap card -->
  <rect x="60" y="620" width="520" height="130" rx="30" fill="#FFFDF8" opacity=".13"/>
  <rect x="60" y="620" width="520" height="130" rx="30" fill="none" stroke="#F7EFE0" stroke-opacity=".3" stroke-width="2"/>
  <path d="M100 662 Q175 622 250 662 T400 662 T540 662" fill="none" stroke="#F7EFE0" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <circle cx="100" cy="662" r="9" fill="#46B8AF"/>
  <circle cx="250" cy="662" r="9" fill="#46B8AF"/>
  <circle cx="400" cy="662" r="9" fill="#46B8AF"/>
  <circle cx="540" cy="662" r="14" fill="#F2A33A"/>
  <circle cx="540" cy="662" r="5" fill="#2A2250"/>

  <!-- progress bar -->
  <rect x="100" y="706" width="440" height="12" rx="6" fill="#F7EFE0" opacity=".2"/>
  <rect x="100" y="706" width="300" height="12" rx="6" fill="#F2A33A"/>
</svg>
