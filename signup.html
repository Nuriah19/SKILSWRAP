<!DOCTYPE html>
<html lang="en">
<head>
      <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Wrap - Create an account</title>
</head>
<body class="auth-body">
     <header class="navbar2">

         <div class="logo">Skills<span class="black">Wrap</span></div>
            <nav class="nav-links">
                <a href="./" class="nav-button">Home</a>
                    <a href ="./#features" class="nav-button">Explore Skills</a>
                    <a href="./#how-it-works" class="nav-button">How it Works</a>
            </nav>
    </header> 
 <main class="signup-container">
    <h1>Create Your Account</h1>
    <p>Start discouvering you skills and future</p>
    <form id="signup-form">
        <label class="fullname">Full Name</label>
        <input type="text" id="fullname" class="signup-input" placeholder="Enter your full name" required>


        <label class="email">Email Adress</label>
        <input type="email" id="email" class="signup-input" placeholder="@gmail.com" required>

        <label class="Password">Password</label>
        <input type="password" id="password"  class="signup-input" placeholder=" Enter your password " required minlength="8" maxlength="10">

        <button type="submit" class="primary-but">Create Account</button>
    </form>
    <p class="login-link">Already have an account?
    <a href="login.html" class="links">Log in</a>
        </p>
 </main>  
   <footer class="footer2">
    <a href="#home" class="logo">Skills<span class="black">Wrap</span></a>
    <p>Your skills. Your journey. Your future.</p>
    <p class="finish">&copy;2026 SkillsWrap.All rights reserved</p>
  </footer> 
<script src="script.js"></script> 
</body>
</html>
