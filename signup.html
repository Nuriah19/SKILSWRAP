<!DOCTYPE html>
<html lang="en">
<head>
      <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Wrap - Create an account</title>
</head>
<body>
 <main class="signup container">
    <h1>Create Your Account</h1>
    <p>Start discouvering you skills and future</p>
    <form id="signup-form">
        <label class="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>


        <label class="email">Email Adress</label>
        <input type="email" id="email" placeholder="@gmail.com" required>

        <label class="Password">Password</label>
        <input type="password" id="password" placeholder="create a password" required minlength="8" maxlength="10">

        <button type="submit" class="primary-but">Create Account</button>
    </form>
    <p class="login-link">Already have an account?>
    <a href="login.html">Log in</a>
        </p>
 </main>   
<script src="script.js"></script> 
</body>
</html>
